spring:
  config:
    # 잘못된 vendor는 시작 때 실패한다. DB별 비밀값은 저장소가 아닌 환경/configtree에서 공급한다.
    import: classpath:database/${SC_DB_VENDOR:h2}.yml
  application:
    name: __APP_NAME__
  datasource:
    url: ${SC_DB_URL:jdbc:h2:file:./.runtime/local/data/app;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SC_DB_USERNAME:sa}
    password: ${SC_DB_PASSWORD:}
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: ${sc.app.database.migration:classpath:db/migration}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${SC_PORT:__SERVER_PORT__}
  address: ${SC_ADDRESS:127.0.0.1}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
sc:
  framework:
    application-name: __APP_NAME__
    operations:
      enabled: false
    messaging:
      enabled: false
    scheduler:
      enabled: false
    browser-errors:
      enabled: false
    observability:
      enabled: false
mybatis:
  mapper-locations: classpath:mappers/*.xml
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
spring.cloud.openfeign.client.config.default:
  connectTimeout: 2000
  readTimeout: 5000
  loggerLevel: none
starter:
  sample-http-url: ${SC_SAMPLE_HTTP_URL:http://127.0.0.1:18190}
logging:
  file:
    name: ${SC_LOG_FILE:./.runtime/local/logs/app.log}
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
