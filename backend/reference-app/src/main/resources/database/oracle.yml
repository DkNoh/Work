# 새 oracle 스키마용 선택 설정. SC_DB_URL/USERNAME/PASSWORD는 배포 환경이 소유한다.
# 기존 H2 Flyway 이력을 다른 DB에 복사하는 데이터 이관 기능이 아니다.
spring:
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: ${SC_DB_URL}
    username: ${SC_DB_USERNAME}
    password: ${SC_DB_PASSWORD}
  jpa:
    # EXTENDED 환경에서도 업무 장문은 앱 DDL의 CLOB을 사용하고 빈 문자열 허용 열의 NULL 의미를 맞춘다.
    mapping-resources: database/oracle-orm.xml
    hibernate:
      naming:
        physical-strategy: dev.scframework.reference.database.OracleReferenceNamingStrategy
  quartz:
    properties:
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.oracle.OracleDelegate
sc:
  app:
    database:
      migration: classpath:db/oracle/migration
      audit-migration: classpath:db/oracle/audit-migration
      operations-migration: classpath:db/oracle/operations-migration
