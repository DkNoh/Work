receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  transform/safe:
    error_mode: propagate
    trace_statements:
      - keep_keys(resource.attributes, ["service.name"])
      - keep_keys(span.attributes, ["http.route", "http.request.method", "http.response.status_code", "error.type"])
      - set(span.status.message, "")
      - keep_keys(spanevent.attributes, [])
    log_statements:
      - keep_keys(resource.attributes, ["service.name"])
      - keep_keys(log.attributes, [])
  batch:
    timeout: 1s
    send_batch_size: 128
exporters:
  otlphttp/tempo:
    endpoint: http://tempo:4318
    timeout: 3s
    retry_on_failure:
      enabled: true
      max_elapsed_time: 30s
    sending_queue:
      queue_size: 1000
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    timeout: 3s
    retry_on_failure:
      enabled: true
      max_elapsed_time: 30s
    sending_queue:
      queue_size: 1000
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/safe, batch]
      exporters: [otlphttp/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/safe, batch]
      exporters: [otlphttp/loki]
