apiVersion: 1
datasources:
  - name: Prometheus
    uid: sc-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Tempo
    uid: sc-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: sc-loki
  - name: Loki
    uid: sc-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: traceId
          datasourceUid: sc-tempo
          matcherRegex: '"traceId":"([a-f0-9]{32})"'
          url: "${__value.raw}"
