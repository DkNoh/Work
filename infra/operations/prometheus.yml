global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: sc-framework-native
    metrics_path: /actuator/prometheus
    basic_auth:
      username: sc-observer
      password_file: /run/sc-secret/observer.secret
    static_configs:
      - targets: [host.docker.internal:18482]
  - job_name: sc-framework-container
    metrics_path: /actuator/prometheus
    basic_auth:
      username: sc-observer
      password_file: /run/sc-secret/observer.secret
    static_configs:
      - targets: [reference-app:18482]
